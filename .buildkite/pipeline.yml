steps:
  - label: "🔍 Lint"
    priority: 80
    key: lint
    commands:
      - .buildkite/run-in-docker.sh .buildkite/lint.sh
    agents:
      queue: "high-concurrency"

  - label: "✅ Test"
    priority: 80
    key: test
    commands:
      - .buildkite/run-in-docker.sh .buildkite/test.sh
    agents:
      queue: "high-concurrency"

  - label: "✅ Test (V2 3,2,2 - V2-only + packed)"
    priority: 80
    key: test-v2-3-2-2
    env:
      CORRO_METADATA_WRITE_VERSION: "3"
      CORRO_METADATA_USE_VERSION: "2"
      CORRO_SYNC_LOG_VERSION: "2"
    commands:
      - .buildkite/run-in-docker.sh .buildkite/test.sh
    agents:
      queue: "high-concurrency"

  - label: "✅ Test (V2 2,2,2 - dual-write + packed)"
    priority: 80
    key: test-v2-2-2-2
    env:
      CORRO_METADATA_WRITE_VERSION: "2"
      CORRO_METADATA_USE_VERSION: "2"
      CORRO_SYNC_LOG_VERSION: "2"
    commands:
      - .buildkite/run-in-docker.sh .buildkite/test.sh
    agents:
      queue: "high-concurrency"

  - label: "🔨 Build"
    priority: 70
    key: build
    commands:
      - .buildkite/run-in-docker.sh .buildkite/build.sh
    artifact_paths:
      - "builds/*.tar.gz"
    agents:
      queue: "high-concurrency"

  - label: "☁️ Upload"
    priority: 50
    key: upload
    commands:
      - .buildkite/upload.sh
    depends_on: [test, test-v2-3-2-2, test-v2-2-2-2, build]
